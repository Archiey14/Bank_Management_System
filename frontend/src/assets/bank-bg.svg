<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10152e"/>
      <stop offset="0.35" stop-color="#1b2347"/>
      <stop offset="0.62" stop-color="#3a4789"/>
      <stop offset="0.82" stop-color="#6672b8"/>
      <stop offset="1" stop-color="#7f8ac9"/>
    </linearGradient>
    <radialGradient id="horizon" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#a9b4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a9b4ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46539a"/>
      <stop offset="1" stop-color="#5a68b0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5aa6"/>
      <stop offset="0.45" stop-color="#2f3b78"/>
      <stop offset="1" stop-color="#232c5e"/>
    </linearGradient>
    <linearGradient id="faceR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#4a5aa6"/>
      <stop offset="0.5" stop-color="#2f3b78"/>
      <stop offset="1" stop-color="#232c5e"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2754"/>
      <stop offset="1" stop-color="#121832"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10152e" stop-opacity="0"/>
      <stop offset="1" stop-color="#10152e" stop-opacity="0.85"/>
    </linearGradient>

    <!-- small lit windows -->
    <pattern id="win" width="14" height="20" patternUnits="userSpaceOnUse">
      <g fill="#ffe2ad">
        <rect x="2" y="3" width="3" height="4" opacity="0.9"/>
        <rect x="8" y="3" width="3" height="4" opacity="0.55"/>
        <rect x="2" y="12" width="3" height="4" opacity="0.7"/>
        <rect x="8" y="12" width="3" height="4" opacity="0.95"/>
      </g>
    </pattern>
    <!-- switches random windows off so it never reads as a grid -->
    <pattern id="off" width="91" height="113" patternUnits="userSpaceOnUse">
      <g fill="#232c5e" opacity="0.92">
        <rect x="0" y="4" width="28" height="40"/>
        <rect x="42" y="0" width="14" height="20"/>
        <rect x="60" y="30" width="28" height="20"/>
        <rect x="14" y="60" width="42" height="20"/>
        <rect x="70" y="72" width="14" height="40"/>
        <rect x="28" y="96" width="28" height="17"/>
        <rect x="0" y="84" width="14" height="20"/>
      </g>
    </pattern>
    <pattern id="floors" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="1" fill="#cdd5ff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="640" height="1000" fill="url(#sky)"/>
  <rect width="640" height="1000" fill="url(#horizon)"/>

  <!-- distant towers (haze-lit) -->
  <g fill="url(#far)" opacity="0.8">
    <rect x="0" y="560" width="50" height="440"/>
    <rect x="58" y="520" width="40" height="480"/>
    <rect x="104" y="590" width="52" height="410"/>
    <rect x="164" y="540" width="38" height="460"/>
    <rect x="210" y="600" width="58" height="400"/>
    <rect x="286" y="570" width="46" height="430"/>
    <rect x="340" y="530" width="38" height="470"/>
    <rect x="386" y="590" width="56" height="410"/>
    <rect x="570" y="540" width="70" height="460"/>
  </g>
  <g fill="url(#win)" opacity="0.35">
    <rect x="58" y="520" width="40" height="480"/>
    <rect x="164" y="540" width="38" height="460"/>
    <rect x="340" y="530" width="38" height="470"/>
    <rect x="570" y="540" width="70" height="460"/>
  </g>

  <!-- hero: tall glass tower (left) -->
  <g>
    <rect x="30" y="400" width="84" height="600" fill="url(#face)"/>
    <rect x="30" y="400" width="84" height="600" fill="url(#win)" opacity="0.9"/>
    <rect x="30" y="400" width="84" height="600" fill="url(#off)"/>
    <rect x="30" y="400" width="84" height="600" fill="url(#floors)"/>
    <rect x="30" y="400" width="2" height="600" fill="#b9c4ff" opacity="0.5"/>
    <rect x="42" y="388" width="60" height="12" fill="#3a4789"/>
    <rect x="68" y="360" width="4" height="28" fill="#5a68b0"/>
    <circle cx="70" cy="358" r="2.5" fill="#ff8a8a"/>
  </g>

  <!-- hero: stepped tower -->
  <g>
    <rect x="140" y="470" width="78" height="530" fill="url(#face)"/>
    <rect x="152" y="448" width="54" height="22" fill="url(#face)"/>
    <rect x="164" y="432" width="30" height="16" fill="url(#face)"/>
    <g fill="url(#win)" opacity="0.9">
      <rect x="140" y="470" width="78" height="530"/>
      <rect x="152" y="448" width="54" height="22"/>
    </g>
    <rect x="140" y="470" width="78" height="530" fill="url(#off)"/>
    <rect x="140" y="470" width="2" height="530" fill="#b9c4ff" opacity="0.45"/>
  </g>

  <!-- hero: rounded tower -->
  <g>
    <path id="rt" d="M390 1000 V640 C390 520 420 440 450 440 C480 440 510 520 510 640 V1000 Z" fill="url(#faceR)"/>
    <path d="M390 1000 V640 C390 520 420 440 450 440 C480 440 510 520 510 640 V1000 Z" fill="url(#win)" opacity="0.75"/>
    <path d="M390 1000 V640 C390 520 420 440 450 440 C480 440 510 520 510 640 V1000 Z" fill="url(#off)"/>
    <g fill="none" stroke="#cdd5ff" stroke-opacity="0.16">
      <path d="M390 700 Q450 690 510 700 M390 780 Q450 770 510 780 M390 860 Q450 850 510 860 M396 620 Q450 610 504 620 M410 550 Q450 540 490 550"/>
      <path d="M420 460 V1000 M450 440 V1000 M480 460 V1000"/>
    </g>
    <path d="M390 1000 V640 C390 520 420 440 450 440" fill="none" stroke="#b9c4ff" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- hero: pointed tower (right) -->
  <g>
    <polygon points="520,1000 556,300 592,1000" fill="url(#faceR)"/>
    <polygon points="556,300 592,1000 560,1000" fill="#0f1430" opacity="0.35"/>
    <polygon points="520,1000 556,300 592,1000" fill="url(#win)" opacity="0.55"/>
    <polygon points="520,1000 556,300 592,1000" fill="url(#off)"/>
    <g stroke="#cdd5ff" stroke-opacity="0.14">
      <path d="M528 900 H584 M534 780 H578 M540 660 H572 M546 540 H566 M550 430 H562"/>
    </g>
    <path d="M520 1000 L556 300" stroke="#b9c4ff" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="555" y="270" width="2" height="30" fill="#b9c4ff" opacity="0.6"/>
  </g>

  <!-- supporting towers -->
  <g>
    <rect x="236" y="640" width="70" height="360" fill="url(#face)"/>
    <rect x="316" y="600" width="64" height="400" fill="url(#face)"/>
    <rect x="600" y="620" width="60" height="380" fill="url(#face)"/>
    <g fill="url(#win)" opacity="0.85">
      <rect x="236" y="640" width="70" height="360"/>
      <rect x="316" y="600" width="64" height="400"/>
      <rect x="600" y="620" width="60" height="380"/>
    </g>
    <g fill="url(#off)">
      <rect x="236" y="640" width="70" height="360"/>
      <rect x="316" y="600" width="64" height="400"/>
      <rect x="600" y="620" width="60" height="380"/>
    </g>
  </g>

  <!-- near dark towers -->
  <g fill="url(#near)">
    <rect x="-6" y="760" width="96" height="240"/>
    <rect x="96" y="730" width="68" height="270"/>
    <rect x="170" y="780" width="76" height="220"/>
    <rect x="250" y="800" width="130" height="200"/>
    <rect x="512" y="770" width="76" height="230"/>
    <rect x="590" y="750" width="60" height="250"/>
  </g>
  <g fill="url(#win)" opacity="0.5">
    <rect x="-6" y="760" width="96" height="240"/>
    <rect x="96" y="730" width="68" height="270"/>
    <rect x="512" y="770" width="76" height="230"/>
    <rect x="590" y="750" width="60" height="250"/>
  </g>
  <g fill="url(#off)" opacity="0.8">
    <rect x="-6" y="760" width="96" height="240"/>
    <rect x="96" y="730" width="68" height="270"/>
    <rect x="512" y="770" width="76" height="230"/>
    <rect x="590" y="750" width="60" height="250"/>
  </g>

  <!-- ground fade so footer text stays readable -->
  <rect x="0" y="820" width="640" height="180" fill="url(#fadeBottom)"/>
</svg>
