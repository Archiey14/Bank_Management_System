<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10152e"/>
      <stop offset="0.35" stop-color="#1b2347"/>
      <stop offset="0.62" stop-color="#3a4789"/>
      <stop offset="0.82" stop-color="#6672b8"/>
      <stop offset="1" stop-color="#7f8ac9"/>
    </linearGradient>
    <radialGradient id="horizon" cx="0.62" cy="1" r="0.65">
      <stop offset="0" stop-color="#a9b4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a9b4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46539a"/>
      <stop offset="1" stop-color="#5a68b0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5aa6"/>
      <stop offset="0.45" stop-color="#2f3b78"/>
      <stop offset="1" stop-color="#232c5e"/>
    </linearGradient>
    <linearGradient id="faceR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#4a5aa6"/>
      <stop offset="0.5" stop-color="#2f3b78"/>
      <stop offset="1" stop-color="#232c5e"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2754"/>
      <stop offset="1" stop-color="#121832"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10152e" stop-opacity="0"/>
      <stop offset="1" stop-color="#10152e" stop-opacity="0.8"/>
    </linearGradient>

    <pattern id="win" width="14" height="20" patternUnits="userSpaceOnUse">
      <g fill="#ffe2ad">
        <rect x="2" y="3" width="3" height="4" opacity="0.9"/>
        <rect x="8" y="3" width="3" height="4" opacity="0.55"/>
        <rect x="2" y="12" width="3" height="4" opacity="0.7"/>
        <rect x="8" y="12" width="3" height="4" opacity="0.95"/>
      </g>
    </pattern>
    <pattern id="off" width="91" height="113" patternUnits="userSpaceOnUse">
      <g fill="#232c5e" opacity="0.92">
        <rect x="0" y="4" width="28" height="40"/>
        <rect x="42" y="0" width="14" height="20"/>
        <rect x="60" y="30" width="28" height="20"/>
        <rect x="14" y="60" width="42" height="20"/>
        <rect x="70" y="72" width="14" height="40"/>
        <rect x="28" y="96" width="28" height="17"/>
        <rect x="0" y="84" width="14" height="20"/>
      </g>
    </pattern>
    <pattern id="floors" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="1" fill="#cdd5ff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="800" fill="url(#sky)"/>
  <rect width="1600" height="800" fill="url(#horizon)"/>

  <!-- distant towers -->
  <g fill="url(#far)" opacity="0.8">
    <rect x="0" y="520" width="70" height="280"/>
    <rect x="80" y="470" width="54" height="330"/>
    <rect x="150" y="540" width="80" height="260"/>
    <rect x="250" y="500" width="60" height="300"/>
    <rect x="330" y="560" width="90" height="240"/>
    <rect x="450" y="490" width="56" height="310"/>
    <rect x="530" y="550" width="84" height="250"/>
    <rect x="640" y="500" width="60" height="300"/>
    <rect x="720" y="470" width="50" height="330"/>
    <rect x="1560" y="480" width="60" height="320"/>
  </g>
  <g fill="url(#win)" opacity="0.35">
    <rect x="80" y="470" width="54" height="330"/>
    <rect x="250" y="500" width="60" height="300"/>
    <rect x="450" y="490" width="56" height="310"/>
    <rect x="640" y="500" width="60" height="300"/>
  </g>

  <!-- supporting towers -->
  <g>
    <rect x="780" y="520" width="84" height="280" fill="url(#face)"/>
    <rect x="1470" y="430" width="80" height="370" fill="url(#face)"/>
    <rect x="1550" y="480" width="70" height="320" fill="url(#face)"/>
    <g fill="url(#win)" opacity="0.85">
      <rect x="780" y="520" width="84" height="280"/>
      <rect x="1470" y="430" width="80" height="370"/>
      <rect x="1550" y="480" width="70" height="320"/>
    </g>
    <g fill="url(#off)">
      <rect x="780" y="520" width="84" height="280"/>
      <rect x="1470" y="430" width="80" height="370"/>
      <rect x="1550" y="480" width="70" height="320"/>
    </g>
  </g>

  <!-- hero: tall glass tower -->
  <g>
    <rect x="880" y="290" width="104" height="510" fill="url(#face)"/>
    <rect x="880" y="290" width="104" height="510" fill="url(#win)" opacity="0.9"/>
    <rect x="880" y="290" width="104" height="510" fill="url(#off)"/>
    <rect x="880" y="290" width="104" height="510" fill="url(#floors)"/>
    <rect x="880" y="290" width="2" height="510" fill="#b9c4ff" opacity="0.5"/>
    <rect x="896" y="278" width="72" height="12" fill="#3a4789"/>
    <rect x="930" y="248" width="4" height="30" fill="#5a68b0"/>
    <circle cx="932" cy="246" r="2.5" fill="#ff8a8a"/>
  </g>

  <!-- hero: stepped tower -->
  <g>
    <rect x="1010" y="380" width="96" height="420" fill="url(#face)"/>
    <rect x="1024" y="354" width="68" height="26" fill="url(#face)"/>
    <rect x="1040" y="334" width="36" height="20" fill="url(#face)"/>
    <g fill="url(#win)" opacity="0.9">
      <rect x="1010" y="380" width="96" height="420"/>
      <rect x="1024" y="354" width="68" height="26"/>
    </g>
    <rect x="1010" y="380" width="96" height="420" fill="url(#off)"/>
    <rect x="1010" y="380" width="2" height="420" fill="#b9c4ff" opacity="0.45"/>
  </g>

  <!-- hero: rounded tower -->
  <g>
    <path d="M1150 800 V520 C1150 400 1190 330 1230 330 C1270 330 1310 400 1310 520 V800 Z" fill="url(#faceR)"/>
    <path d="M1150 800 V520 C1150 400 1190 330 1230 330 C1270 330 1310 400 1310 520 V800 Z" fill="url(#win)" opacity="0.75"/>
    <path d="M1150 800 V520 C1150 400 1190 330 1230 330 C1270 330 1310 400 1310 520 V800 Z" fill="url(#off)"/>
    <g fill="none" stroke="#cdd5ff" stroke-opacity="0.16">
      <path d="M1150 580 Q1230 570 1310 580 M1150 650 Q1230 640 1310 650 M1150 720 Q1230 710 1310 720 M1156 520 Q1230 510 1304 520 M1176 450 Q1230 440 1284 450"/>
      <path d="M1190 350 V800 M1230 330 V800 M1270 350 V800"/>
    </g>
    <path d="M1150 800 V520 C1150 400 1190 330 1230 330" fill="none" stroke="#b9c4ff" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- hero: pointed tower -->
  <g>
    <polygon points="1340,800 1392,170 1444,800" fill="url(#faceR)"/>
    <polygon points="1392,170 1444,800 1400,800" fill="#0f1430" opacity="0.35"/>
    <polygon points="1340,800 1392,170 1444,800" fill="url(#win)" opacity="0.55"/>
    <polygon points="1340,800 1392,170 1444,800" fill="url(#off)"/>
    <g stroke="#cdd5ff" stroke-opacity="0.14">
      <path d="M1350 710 H1434 M1358 610 H1426 M1368 510 H1416 M1376 410 H1408 M1384 310 H1400"/>
    </g>
    <path d="M1340 800 L1392 170" stroke="#b9c4ff" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="1391" y="130" width="2" height="40" fill="#b9c4ff" opacity="0.6"/>
  </g>

  <!-- near dark towers -->
  <g fill="url(#near)">
    <rect x="-10" y="640" width="120" height="160"/>
    <rect x="120" y="610" width="90" height="190"/>
    <rect x="220" y="660" width="110" height="140"/>
    <rect x="340" y="630" width="100" height="170"/>
    <rect x="450" y="670" width="140" height="130"/>
    <rect x="600" y="640" width="100" height="160"/>
    <rect x="710" y="680" width="150" height="120"/>
    <rect x="1316" y="700" width="60" height="100"/>
    <rect x="1560" y="620" width="60" height="180"/>
  </g>
  <g fill="url(#win)" opacity="0.5">
    <rect x="-10" y="640" width="120" height="160"/>
    <rect x="120" y="610" width="90" height="190"/>
    <rect x="340" y="630" width="100" height="170"/>
    <rect x="600" y="640" width="100" height="160"/>
    <rect x="1560" y="620" width="60" height="180"/>
  </g>
  <g fill="url(#off)" opacity="0.8">
    <rect x="-10" y="640" width="120" height="160"/>
    <rect x="120" y="610" width="90" height="190"/>
    <rect x="340" y="630" width="100" height="170"/>
    <rect x="600" y="640" width="100" height="160"/>
    <rect x="1560" y="620" width="60" height="180"/>
  </g>

  <rect x="0" y="660" width="1600" height="140" fill="url(#fadeBottom)"/>
</svg>
